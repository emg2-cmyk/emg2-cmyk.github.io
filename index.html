<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Bottle Clicker</title>
    <!-- Link to our external CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1>💧 Water Bottle Clicker 💧</h1>
        <p>Stay hydrated and click the bottle to stack up water!</p>
        
        <!-- Score display -->
        <div class="score-board">
            <span id="score">0</span> Water Bottles
        </div>

        <!-- Clickable Water Bottle Image -->
        <div id="click-target" class="bottle">
            🧴
        </div>

        <!-- Upgrade Button -->
        <div class="shop">
            <button id="upgrade-btn">Buy Water Filter (Cost: <span id="upgrade-cost">15</span>) - +1 Per Click</button>
        </div>
    </div>

    <!-- Link to our external JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
