<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Awesome Website</title>
    <!-- Link to our external CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main header section -->
    <header>
        <h1>Welcome to My Website!</h1>
        <p>Built with HTML, CSS, and JavaScript, hosted on GitHub Pages.</p>
    </header>

    <!-- Interactive section -->
    <main>
        <section class="card">
            <h2>Interactive Area</h2>
            <p>Click the button below to see JavaScript in action!</p>
            <button id="colorBtn">Click Me!</button>
        </section>
    </main>

    <!-- Footer section -->
    <footer>
        <p>&copy; 2026 My Web Development Journey</p>
    </footer>

    <!-- Link to our external JavaScript file (loaded at the end of body) -->
    <script src="script.js"></script>
</body>
</html>
